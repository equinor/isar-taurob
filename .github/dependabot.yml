version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock), including transitive updates.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    groups:
      # Use Dependabot's native 3-day cooldown for version updates.
      python-patch-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      # Bundle major bumps separately from patch and minor updates.
      python-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
