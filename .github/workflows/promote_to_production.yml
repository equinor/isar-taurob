name: Promote to Production

permissions:
  contents: read
  pull-requests: read
  packages: write

# Only one workflow in a concurrency group may run at a time
concurrency:
  group: production-concurrency
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  trigger-github-deployment:
    name: Trigger GitHub Deployment
    environment: Production
    runs-on: ubuntu-latest
    steps:
      - name: Empty Step
        run: echo "Hello World"

  get_staging_version:
    name: Get version from staging
    needs: trigger-github-deployment
    outputs:
      versionTag: ${{ steps.get_version_tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v6
        with:
          ref: main
          repository: equinor/robotics-infrastructure
          ssh-key: ${{ secrets.ROBOTICS_INFRASTRUCTURE_DEPLOY_KEY }}

      - name: Get Isar-Taurob version in staging
        id: get_version_tag
        run: |
          LINE_NUMBERS=($(grep -n "roboticsstagingacr.azurecr.io/robotics/isar-taurob" "k8s_kustomize/robotics/overlays/staging/kustomization.yaml" | cut -d ':' -f 1))
          largest_version_int=0
          largest_version_tag=
          for line_number in "${LINE_NUMBERS[@]}"
          do
              TAG_LINE_NUMBER=$((line_number+1))
              version_tag=$(sed -n "${TAG_LINE_NUMBER}p" k8s_kustomize/robotics/overlays/staging/kustomization.yaml  |  cut --delimiter=":" --fields=2 | tr -d '[:space:]')
              version_int=$(echo "$version_tag" | tr -d '.' | tr -d '\n' | tr -d '\r' | tr -d 'v')
              if [[ "$version_int" -gt "$largest_version_int" ]]; then
                  largest_version_tag=$version_tag
                  largest_version_int=$version_int
              fi
          done
          echo "tag=$largest_version_tag" >> "$GITHUB_OUTPUT"

  copy-image-to-robotics-prod-registry:
    name: Copy staging image to robotics prod registry
    needs: [get_staging_version, trigger-github-deployment]
    permissions:
      contents: read
      # Declared by the shared workflow for its OIDC path; a called
      # workflow can never exceed the calling job.
      id-token: write
    uses: equinor/armada/.github/workflows/copy_image_between_registries.yml@main
    with:
      source_registry: roboticsstagingacr.azurecr.io
      destination_registry: roboticsprodacr.azurecr.io
      image_name: robotics/isar-taurob
      tag: ${{ needs.get_staging_version.outputs.versionTag }}
      # Authenticate to both registries with a federated credential
      # instead of the registry passwords. The identity holds AcrPull
      # on staging and AcrPush on production, because promotion reads
      # from one and writes to the other.
      use_oidc: true
      environment: Production
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  deploy:
    name: Update deployment in Production
    needs: [get_staging_version, trigger-github-deployment, copy-image-to-robotics-prod-registry]
    uses: equinor/armada/.github/workflows/update_kubernetes_deployment.yml@main
    with:
      environment: production
      tag: ${{ needs.get_staging_version.outputs.versionTag }}
      registry: roboticsprodacr.azurecr.io
      image_name: robotics/isar-taurob
      author_name: ${{ github.actor }}
      infrastructure_repository: equinor/robotics-infrastructure
      kustomization_base_path: k8s_kustomize/robotics/overlays
    secrets:
      deploy_key: ${{ secrets.ROBOTICS_INFRASTRUCTURE_DEPLOY_KEY }}
